<title>运动记录</title>
<style>
  :root{
    --bg:#f7f5f2;
    --card:#ffffff;
    --ink:#1c1a17;
    --ink-2:#6b6560;
    --ink-3:#9c958e;
    --line:#e7e2db;
    --accent:#2f6f5e;
    --accent-soft:#e4efe9;
    --warm:#b5762f;
    --warm-soft:#f6ece0;
    --danger:#b4413a;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    font-size:16px;
    line-height:1.5;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(40px + env(safe-area-inset-bottom)) env(safe-area-inset-left);
    -webkit-font-smoothing:antialiased;
  }
  @media all and (display-mode:standalone){
    header{padding-top:8px}
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 14px}

  header{
    padding:18px 0 10px;
    display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  }
  header h1{font-size:20px;margin:0;letter-spacing:.5px;font-weight:650}
  .stat{font-size:13px;color:var(--ink-2);text-align:right;white-space:nowrap}
  .stat b{color:var(--accent);font-weight:650}

  .tabs{
    display:flex;gap:4px;background:#ece8e2;border-radius:11px;padding:3px;margin-bottom:14px;
  }
  .tab{
    flex:1;appearance:none;border:none;background:none;font-family:inherit;font-size:15px;
    color:var(--ink-2);padding:9px 0;border-radius:9px;cursor:pointer;font-weight:600;
  }
  .tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:14px;
  }

  .label{
    font-size:12px;
    color:var(--ink-3);
    letter-spacing:1px;
    margin:0 0 8px;
    display:flex;align-items:center;gap:8px;
  }
  .label span.hint{color:var(--ink-3);letter-spacing:0}
  .row + .row{margin-top:14px}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    appearance:none;
    border:1px solid var(--line);
    background:#fbfaf8;
    color:var(--ink);
    font-size:15px;
    font-family:inherit;
    padding:10px 14px;
    border-radius:999px;
    min-height:42px;
    cursor:pointer;
    transition:background .12s ease,border-color .12s ease,color .12s ease;
  }
  .chip:active{transform:scale(.97)}
  .chip.on{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:600;
  }
  .chip.small{font-size:14px;padding:8px 12px;min-height:38px}
  #meals .chip.on{background:var(--warm);border-color:var(--warm)}

  input[type=date],input[type=text],input[type=number]{
    width:100%;
    font-family:inherit;
    font-size:16px;
    color:var(--ink);
    background:#fbfaf8;
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 12px;
    min-height:44px;
  }
  input:focus{outline:none;border-color:var(--accent);background:#fff}
  .inline{display:flex;gap:8px;align-items:center}
  .inline input[type=number]{width:96px}

  .save{
    display:block;width:100%;text-align:center;
    margin-top:16px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:12px;
    font-family:inherit;
    font-size:17px;
    font-weight:650;
    padding:15px;
    min-height:52px;
    cursor:pointer;
    letter-spacing:1px;
  }
  .save:active{opacity:.85}
  .save:disabled{background:#cfcac4;color:#fff}
  .save.warm{background:var(--warm)}
  .save.sub{
    background:#fff;color:var(--ink-2);border:1px solid var(--line);
    font-size:15px;font-weight:600;padding:12px;min-height:46px;margin-top:8px;
  }

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);
    background:var(--ink);color:#fff;font-size:14px;padding:10px 18px;border-radius:999px;
    opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:60;
    max-width:86%;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .listhead{
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 2px 10px;
  }
  .listhead h2{font-size:14px;margin:0;color:var(--ink-2);font-weight:600;letter-spacing:1px}
  .listhead .acts{display:flex;gap:8px}
  .ghost{
    background:#fff;border:1px solid var(--line);color:var(--ink-2);
    font-family:inherit;font-size:13px;padding:7px 12px;border-radius:999px;cursor:pointer;
  }
  .ghost:active{background:#f0ede8}

  .entry{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 12px 12px 14px;
    margin-bottom:10px;
    display:flex;gap:10px;align-items:flex-start;
    position:relative;
  }
  .entry .bar{
    position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);opacity:.6;
  }
  .entry .body{flex:1;min-width:0}
  .entry .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .entry .act{font-size:16px;font-weight:650}
  .entry .part{
    font-size:12px;background:var(--accent-soft);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-weight:600;
  }
  .entry .mins{font-size:13px;color:var(--ink-2);margin-left:auto}
  .entry .meta{font-size:12px;color:var(--ink-3);margin-top:3px}
  .entry .note{font-size:14px;color:var(--ink-2);margin-top:6px;word-break:break-word}
  .del{
    background:none;border:none;color:var(--ink-3);font-size:20px;line-height:1;
    padding:2px 4px;cursor:pointer;font-family:inherit;
  }
  .del:active{color:var(--danger)}

  .daygroup{margin-bottom:16px}
  .dayhead{
    display:flex;align-items:center;justify-content:space-between;
    padding:0 2px 8px;
  }
  .dayhead .d{font-size:13px;color:var(--ink-2);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .shot{
    position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;
    background:#ece8e2;border:1px solid var(--line);cursor:pointer;
  }
  .shot img{width:100%;height:100%;object-fit:cover;display:block}
  .shot .tag{
    position:absolute;left:6px;bottom:6px;
    background:rgba(28,26,23,.72);color:#fff;font-size:11px;font-weight:600;
    padding:2px 7px;border-radius:999px;backdrop-filter:blur(4px);
  }

  .goal{padding:14px 14px 12px}
  .goalTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
  .glabel{font-size:14px;font-weight:650;letter-spacing:.5px}
  .stepper{display:flex;align-items:center;gap:10px}
  .stepper button{
    width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fbfaf8;
    color:var(--ink-2);font-family:inherit;font-size:17px;line-height:1;cursor:pointer;padding:0;
  }
  .stepper button:active{background:#efece7}
  .stepper .num{font-size:19px;font-weight:700;min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
  .stepper .unit{font-size:13px;color:var(--ink-3);margin-left:-6px}
  .segs{display:flex;gap:5px;margin-bottom:9px}
  .seg{flex:1;height:10px;border-radius:5px;background:#ece8e2;transition:background .35s ease}
  .seg.on{background:var(--accent)}
  .seg.pop{animation:segpop .5s cubic-bezier(.34,1.56,.64,1)}
  @keyframes segpop{0%{transform:scaleY(.5);opacity:.4}55%{transform:scaleY(1.7)}100%{transform:scaleY(1)}}
  .gnote{font-size:13px;color:var(--ink-3)}
  .gnote.done{color:var(--accent);font-weight:650}

  #fx{position:fixed;inset:0;pointer-events:none;z-index:70;display:none}
  #banner{
    position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.7);
    z-index:71;pointer-events:none;opacity:0;
    font-size:26px;font-weight:750;letter-spacing:2px;color:var(--accent);
    background:rgba(255,255,255,.92);padding:14px 26px;border-radius:999px;
    box-shadow:0 8px 30px rgba(28,26,23,.14);white-space:nowrap;
    transition:opacity .3s ease,transform .45s cubic-bezier(.34,1.56,.64,1);
  }
  #banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

  .empty{
    text-align:center;color:var(--ink-3);font-size:14px;padding:34px 10px;
    background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
  }
  .foot{text-align:center;color:var(--ink-3);font-size:12px;padding:18px 0 6px;line-height:1.8}
  .foot button{background:none;border:none;color:var(--ink-3);font-size:12px;text-decoration:underline;font-family:inherit;cursor:pointer}

  dialog{border:none;border-radius:14px;padding:16px;max-width:440px;width:92%;background:var(--card);color:var(--ink);font-family:inherit}
  dialog::backdrop{background:rgba(28,26,23,.45)}
  dialog textarea{width:100%;height:150px;font-family:ui-monospace,Menlo,monospace;font-size:12px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fbfaf8;color:var(--ink)}
  dialog .drow{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
  #viewer img{width:100%;border-radius:10px;display:block;margin-bottom:10px}
  #viewer .vmeta{font-size:13px;color:var(--ink-2);margin:0 0 10px}
  .hidden{display:none !important}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1 id="title">运动记录</h1>
    <div class="stat" id="stat"></div>
  </header>

  <div class="tabs">
    <button class="tab on" data-tab="move" type="button">运动</button>
    <button class="tab" data-tab="food" type="button">吃的</button>
  </div>

  <!-- 运动 -->
  <section id="pane-move">
    <div class="card goal" id="goalCard">
      <div class="goalTop">
        <span class="glabel">这周目标</span>
        <div class="stepper">
          <button id="goalMinus" type="button" aria-label="减少">−</button>
          <span class="num" id="goalNum">4</span><span class="unit">次</span>
          <button id="goalPlus" type="button" aria-label="增加">+</button>
        </div>
      </div>
      <div class="segs" id="segs"></div>
      <div class="gnote" id="goalNote"></div>
    </div>

    <div class="card">
      <div class="row">
        <p class="label">日期</p>
        <div class="chips" style="margin-bottom:8px">
          <button class="chip small" data-day="0" type="button">今天</button>
          <button class="chip small" data-day="1" type="button">昨天</button>
          <button class="chip small" data-day="2" type="button">前天</button>
        </div>
        <input type="date" id="date">
      </div>

      <div class="row">
        <p class="label">做了什么</p>
        <div class="chips" id="acts"></div>
      </div>

      <div class="row">
        <p class="label">练了哪个部位</p>
        <div class="chips" id="parts"></div>
      </div>

      <div class="row">
        <p class="label">时长</p>
        <div class="chips" id="mins" style="margin-bottom:8px"></div>
        <div class="inline">
          <input type="number" id="minsCustom" inputmode="numeric" placeholder="其他" min="1" max="600">
          <span style="color:var(--ink-3);font-size:14px">分钟</span>
        </div>
      </div>

      <div class="row">
        <p class="label">备注 <span class="hint">可不填</span></p>
        <input type="text" id="note" maxlength="60" placeholder="比如 腿很累 / 臀推加了重量">
      </div>

      <button class="save" id="save" type="button">保存</button>
    </div>

    <div class="listhead">
      <h2 id="listTitle">最近记录</h2>
      <div class="acts">
        <button class="ghost" id="copy" type="button">一键复制</button>
      </div>
    </div>

    <div id="list"></div>

    <div class="foot">
      数据只存在这台手机上 ·
      <button id="backup" type="button">备份 / 恢复</button>
    </div>
  </section>

  <!-- 吃的 -->
  <section id="pane-food" class="hidden">
    <div class="card">
      <div class="row">
        <p class="label">哪一餐 <span class="hint">按时间自动选好了</span></p>
        <div class="chips" id="meals"></div>
      </div>
      <label class="save warm" for="camera">拍照</label>
      <input type="file" id="camera" accept="image/*" capture="environment" hidden>
      <label class="save sub" for="picker">从相册选</label>
      <input type="file" id="picker" accept="image/*" multiple hidden>
    </div>

    <div class="listhead">
      <h2 id="foodTitle">最近吃的</h2>
    </div>

    <div id="foodList"></div>

    <div class="foot">
      照片只存在这台手机上，没有上传到任何地方<br>
      <span id="usage"></span>
    </div>
  </section>
</div>

<canvas id="fx"></canvas>
<div id="banner"></div>
<div class="toast" id="toast"></div>

<dialog id="dlg">
  <p style="margin:0 0 8px;font-size:14px;color:var(--ink-2)">下面是运动记录的全部数据。换手机时复制这段文字，在新手机里粘贴进来再点恢复。照片体积大，不在这里面，换手机前先用「分享今天」把照片存到相册。</p>
  <textarea id="dlgText" spellcheck="false"></textarea>
  <div class="drow">
    <button class="ghost" id="dlgRestore" type="button">粘贴后恢复</button>
    <button class="ghost" id="dlgClose" type="button">关闭</button>
  </div>
</dialog>

<dialog id="viewer">
  <img id="vImg" alt="">
  <p class="vmeta" id="vMeta"></p>
  <div class="drow">
    <button class="ghost" id="vShare" type="button">分享 / 存到相册</button>
    <button class="ghost" id="vDelete" type="button">删除</button>
    <button class="ghost" id="vClose" type="button">关闭</button>
  </div>
</dialog>

<script>
(function(){
  "use strict";

  var KEY = "yundong-jilu-v1";
  var GOAL_KEY = "yundong-goal";
  var ACTS = ["跑步","网球","游泳","Tone House","HYROX","健身房"];
  var PARTS = ["腿","背","肩","胸","手臂","核心","全身","不适用"];
  var MINS = [30,45,60,75,90];
  var MEALS = ["早餐","午餐","晚餐","加餐"];
  var AUTO = {"跑步":"全身","游泳":"全身","网球":"全身","Tone House":"全身","HYROX":"全身"};
  var WEEK = ["周日","周一","周二","周三","周四","周五","周六"];

  var records = [];
  var goal = 4;
  var lastFilled = -1;
  var sel = { date:"", act:"", part:"", mins:0 };
  var meal = "";
  var photos = [];          // {id,date,meal,ts,type,size,blob}
  var urls = {};            // id -> objectURL
  var viewing = null;
  var tab = "move";

  function $(id){ return document.getElementById(id); }

  /* ---------- 运动记录：localStorage ---------- */

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      records = raw ? JSON.parse(raw) : [];
      if(!Array.isArray(records)) records = [];
    }catch(e){ records = []; }
  }
  function persist(){
    try{ localStorage.setItem(KEY, JSON.stringify(records)); }
    catch(e){ toast("这个浏览器存不下，先用备份功能"); }
  }
  function loadGoal(){
    try{
      var g = parseInt(localStorage.getItem(GOAL_KEY), 10);
      goal = (g >= 1 && g <= 14) ? g : 4;
    }catch(e){ goal = 4; }
  }
  function saveGoal(){
    try{ localStorage.setItem(GOAL_KEY, String(goal)); }catch(e){}
  }

  /* ---------- 照片：IndexedDB ---------- */

  var DB_NAME = "yundong-photos";
  var STORE = "photos";
  var dbp = null;

  function db(){
    if(dbp) return dbp;
    dbp = new Promise(function(res, rej){
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function(){
        var d = req.result;
        if(!d.objectStoreNames.contains(STORE)){
          d.createObjectStore(STORE, { keyPath:"id" });
        }
      };
      req.onsuccess = function(){ res(req.result); };
      req.onerror = function(){ rej(req.error); };
    });
    return dbp;
  }
  function tx(mode){
    return db().then(function(d){ return d.transaction(STORE, mode).objectStore(STORE); });
  }
  function dbAll(){
    return tx("readonly").then(function(st){
      return new Promise(function(res, rej){
        var r = st.getAll();
        r.onsuccess = function(){ res(r.result || []); };
        r.onerror = function(){ rej(r.error); };
      });
    });
  }
  function dbPut(rec){
    return tx("readwrite").then(function(st){
      return new Promise(function(res, rej){
        var r = st.put(rec);
        r.onsuccess = function(){ res(); };
        r.onerror = function(){ rej(r.error); };
      });
    });
  }
  function dbDel(id){
    return tx("readwrite").then(function(st){
      return new Promise(function(res, rej){
        var r = st.delete(id);
        r.onsuccess = function(){ res(); };
        r.onerror = function(){ rej(r.error); };
      });
    });
  }

  /* ---------- 工具 ---------- */

  function todayStr(offset){
    var d = new Date();
    d.setDate(d.getDate() - (offset||0));
    var m = String(d.getMonth()+1).padStart(2,"0");
    var day = String(d.getDate()).padStart(2,"0");
    return d.getFullYear() + "-" + m + "-" + day;
  }
  function fmtDate(s){
    var p = s.split("-");
    if(p.length !== 3) return s;
    var d = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
    return Number(p[1]) + "月" + Number(p[2]) + "日 " + WEEK[d.getDay()];
  }
  function dayDiff(s){
    var p = s.split("-");
    var d = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
    var t = new Date(); t.setHours(0,0,0,0);
    return Math.round((t - d) / 86400000);
  }
  function relLabel(s){
    var diff = dayDiff(s);
    return diff === 0 ? "今天" : (diff === 1 ? "昨天" : (diff === 2 ? "前天" : ""));
  }
  function fmtTime(ts){
    var d = new Date(ts);
    return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  }
  function mealByHour(){
    var h = new Date().getHours();
    if(h < 10) return "早餐";
    if(h < 15) return "午餐";
    if(h < 21) return "晚餐";
    return "加餐";
  }
  function toast(msg){
    var el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(el._t);
    el._t = setTimeout(function(){ el.classList.remove("show"); }, 1800);
  }

  function chips(container, items, onPick, cls){
    container.innerHTML = "";
    items.forEach(function(v){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip" + (cls ? " " + cls : "");
      b.textContent = typeof v === "number" ? v + "分" : v;
      b.dataset.val = v;
      b.addEventListener("click", function(){ onPick(v); });
      container.appendChild(b);
    });
  }
  function paint(container, val){
    Array.prototype.forEach.call(container.children, function(b){
      b.classList.toggle("on", String(b.dataset.val) === String(val));
    });
  }

  /* ---------- 运动：交互 ---------- */

  function pickAct(v){
    sel.act = (sel.act === v) ? "" : v;
    paint($("acts"), sel.act);
    if(sel.act && !sel.part && AUTO[sel.act]){
      sel.part = AUTO[sel.act];
      paint($("parts"), sel.part);
    }
    refreshSave();
  }
  function pickPart(v){
    sel.part = (sel.part === v) ? "" : v;
    paint($("parts"), sel.part);
    refreshSave();
  }
  function pickMins(v){
    sel.mins = (sel.mins === v) ? 0 : v;
    paint($("mins"), sel.mins);
    $("minsCustom").value = "";
    refreshSave();
  }
  function pickDay(off){
    sel.date = todayStr(off);
    $("date").value = sel.date;
    paintDays();
  }
  function paintDays(){
    Array.prototype.forEach.call(document.querySelectorAll("[data-day]"), function(b){
      b.classList.toggle("on", todayStr(Number(b.dataset.day)) === sel.date);
    });
  }
  function refreshSave(){
    $("save").disabled = !(sel.date && sel.act && currentMins() > 0);
  }
  function currentMins(){
    var custom = parseInt($("minsCustom").value, 10);
    if(custom > 0) return custom;
    return sel.mins || 0;
  }

  function addRecord(){
    var m = currentMins();
    if(!sel.date || !sel.act || !m) return;
    var before = weekStats().count;
    records.push({
      id: String(Date.now()) + Math.random().toString(16).slice(2,6),
      date: sel.date,
      act: sel.act,
      part: sel.part || "不适用",
      mins: m,
      note: $("note").value.trim()
    });
    persist();
    var justSaved = sel.date;
    var after = weekStats().count;
    render(after > before && after <= goal ? after - 1 : -1);
    sel.act = ""; sel.part = ""; sel.mins = 0;
    paint($("acts"), ""); paint($("parts"), ""); paint($("mins"), "");
    $("minsCustom").value = "";
    $("note").value = "";
    refreshSave();
    toast("已记下 " + fmtDate(justSaved));
    window.scrollTo({ top: 0, behavior: "smooth" });
    if(after > before){
      setTimeout(function(){
        celebrate(before < goal && after >= goal);
      }, 260);
    }
  }

  function removeRecord(id){
    records = records.filter(function(r){ return r.id !== id; });
    persist();
    render();
    toast("已删除");
  }

  function sorted(){
    return records.slice().sort(function(a,b){
      if(a.date === b.date) return Number(b.id.slice(0,13)) - Number(a.id.slice(0,13));
      return a.date < b.date ? 1 : -1;
    });
  }

  function render(animateIndex){
    var list = $("list");
    var rows = sorted();
    list.innerHTML = "";

    if(!rows.length){
      var e = document.createElement("div");
      e.className = "empty";
      e.textContent = "还没有记录，上面点两下就存好了";
      list.appendChild(e);
    }else{
      rows.forEach(function(r){
        var d = document.createElement("div");
        d.className = "entry";

        var bar = document.createElement("div");
        bar.className = "bar";

        var body = document.createElement("div");
        body.className = "body";

        var top = document.createElement("div");
        top.className = "top";
        var act = document.createElement("span");
        act.className = "act"; act.textContent = r.act;
        top.appendChild(act);
        if(r.part && r.part !== "不适用"){
          var p = document.createElement("span");
          p.className = "part"; p.textContent = r.part;
          top.appendChild(p);
        }
        var mins = document.createElement("span");
        mins.className = "mins"; mins.textContent = r.mins + " 分钟";
        top.appendChild(mins);

        var meta = document.createElement("div");
        meta.className = "meta";
        var rel = relLabel(r.date);
        meta.textContent = fmtDate(r.date) + (rel ? "  " + rel : "");

        body.appendChild(top);
        body.appendChild(meta);

        if(r.note){
          var n = document.createElement("div");
          n.className = "note"; n.textContent = r.note;
          body.appendChild(n);
        }

        var del = document.createElement("button");
        del.className = "del"; del.type = "button";
        del.setAttribute("aria-label","删除");
        del.textContent = "×";
        del.addEventListener("click", function(){ removeRecord(r.id); });

        d.appendChild(bar);
        d.appendChild(body);
        d.appendChild(del);
        list.appendChild(d);
      });
    }

    $("listTitle").textContent = "最近记录" + (rows.length ? "（" + rows.length + " 条）" : "");
    renderGoal(typeof animateIndex === "number" ? animateIndex : -1);
    renderStat();
  }

  function weekStats(){
    var now = new Date(); now.setHours(0,0,0,0);
    var dow = now.getDay() === 0 ? 6 : now.getDay() - 1;
    var monday = new Date(now); monday.setDate(now.getDate() - dow);
    var count = 0, total = 0;
    records.forEach(function(r){
      var p = r.date.split("-");
      var d = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
      if(d >= monday){ count++; total += Number(r.mins) || 0; }
    });
    return { count: count, total: total };
  }

  function renderStat(){
    if(tab === "food"){
      var t = todayStr(0);
      var n = photos.filter(function(p){ return p.date === t; }).length;
      $("stat").innerHTML = n ? "今天 <b>" + n + "</b> 张" : "今天还没拍";
      return;
    }
    var w = weekStats();
    $("stat").innerHTML = w.count
      ? "本周 <b>" + w.count + "</b> 次 · <b>" + w.total + "</b> 分钟"
      : "本周还没动";
  }

  function renderGoal(animateIndex){
    var count = weekStats().count;
    var filled = Math.min(count, goal);
    $("goalNum").textContent = goal;
    $("goalMinus").disabled = goal <= 1;
    $("goalPlus").disabled = goal >= 14;

    var segs = $("segs");
    segs.innerHTML = "";
    for(var i = 0; i < goal; i++){
      var s = document.createElement("div");
      s.className = "seg" + (i < filled ? " on" : "");
      if(animateIndex === i) s.classList.add("pop");
      segs.appendChild(s);
    }

    var note = $("goalNote");
    if(count >= goal){
      note.className = "gnote done";
      note.textContent = count > goal
        ? "这周达标了，还多练了 " + (count - goal) + " 次"
        : "这周达标了";
    }else{
      note.className = "gnote";
      note.textContent = count === 0
        ? "这周还差 " + goal + " 次"
        : "已完成 " + count + " 次，还差 " + (goal - count) + " 次";
    }
    lastFilled = filled;
  }

  function changeGoal(delta){
    var next = goal + delta;
    if(next < 1 || next > 14) return;
    var before = weekStats().count >= goal;
    goal = next;
    saveGoal();
    renderGoal();
    var after = weekStats().count >= goal;
    if(!before && after) celebrate(true);
  }

  /* ---------- 烟花 ---------- */

  var fxCtx = null, fxParts = [], fxRunning = false;
  var FX_COLORS = ["#2f6f5e","#b5762f","#d9a441","#c0603f","#7fa88f","#e8c46a","#4f8f78"];

  function reduceMotion(){
    return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }
  function fxSetup(){
    var c = $("fx");
    fxCtx = c.getContext("2d");
    function size(){
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      c.width = Math.round(window.innerWidth * dpr);
      c.height = Math.round(window.innerHeight * dpr);
      c.style.width = window.innerWidth + "px";
      c.style.height = window.innerHeight + "px";
      fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    size();
    window.addEventListener("resize", size);
  }
  function burst(x, y, n, power){
    for(var i = 0; i < n; i++){
      var a = Math.random() * Math.PI * 2;
      var sp = power * (0.32 + Math.random() * 0.68);
      fxParts.push({
        x:x, y:y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - power * 0.18,
        life: 1,
        decay: 0.011 + Math.random() * 0.013,
        r: 1.5 + Math.random() * 2.1,
        c: FX_COLORS[(Math.random() * FX_COLORS.length) | 0]
      });
    }
    if(!fxRunning){
      fxRunning = true;
      $("fx").style.display = "block";
      requestAnimationFrame(fxTick);
    }
  }
  function fxTick(){
    var w = window.innerWidth, h = window.innerHeight;
    fxCtx.clearRect(0, 0, w, h);
    for(var i = fxParts.length - 1; i >= 0; i--){
      var p = fxParts[i];
      p.vx *= 0.986;
      p.vy = p.vy * 0.986 + 0.052;
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      if(p.life <= 0 || p.y > h + 30){ fxParts.splice(i, 1); continue; }
      fxCtx.globalAlpha = Math.max(0, Math.min(1, p.life));
      fxCtx.fillStyle = p.c;
      fxCtx.beginPath();
      fxCtx.arc(p.x, p.y, p.r * (0.5 + p.life * 0.5), 0, Math.PI * 2);
      fxCtx.fill();
    }
    fxCtx.globalAlpha = 1;
    if(fxParts.length){
      requestAnimationFrame(fxTick);
    }else{
      fxRunning = false;
      fxCtx.clearRect(0, 0, w, h);
      $("fx").style.display = "none";
    }
  }
  function showBanner(text){
    var b = $("banner");
    b.textContent = text;
    b.classList.add("show");
    clearTimeout(b._t);
    b._t = setTimeout(function(){ b.classList.remove("show"); }, 2200);
  }
  function celebrate(big){
    if(big) showBanner("这周目标达成");
    if(reduceMotion()) return;
    if(!fxCtx) fxSetup();
    if(big){
      var w = window.innerWidth, h = window.innerHeight;
      [0, 220, 420, 640, 880].forEach(function(delay, i){
        setTimeout(function(){
          burst(w * (0.18 + Math.random() * 0.64), h * (0.2 + Math.random() * 0.22), 60, 7.5);
        }, delay);
      });
    }else{
      var box = $("goalCard").getBoundingClientRect();
      burst(box.left + box.width / 2, box.top + box.height / 2, 34, 4.6);
    }
  }

  function exportText(){
    var rows = sorted();
    if(!rows.length) return "还没有记录";
    var lines = ["运动记录（共 " + rows.length + " 次）", ""];
    var last = "";
    rows.forEach(function(r){
      if(r.date !== last){ lines.push(fmtDate(r.date)); last = r.date; }
      var s = "  " + r.act;
      if(r.part && r.part !== "不适用") s += " · " + r.part;
      s += " · " + r.mins + "分钟";
      if(r.note) s += " · " + r.note;
      lines.push(s);
    });
    return lines.join("\n");
  }

  function copyOut(){
    var text = exportText();
    var done = function(){ toast("已复制，可以直接粘贴发出去"); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, function(){ legacyCopy(text, done); });
    }else{
      legacyCopy(text, done);
    }
  }
  function legacyCopy(text, done){
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); done(); }
    catch(e){ toast("复制失败，用备份窗口手动选"); }
    document.body.removeChild(ta);
  }

  /* ---------- 吃的：拍照与存储 ---------- */

  function shrink(file){
    return new Promise(function(res){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        var MAX = 1280;
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, MAX / Math.max(w, h));
        var cw = Math.round(w * scale), ch = Math.round(h * scale);
        var c = document.createElement("canvas");
        c.width = cw; c.height = ch;
        c.getContext("2d").drawImage(img, 0, 0, cw, ch);
        URL.revokeObjectURL(url);
        c.toBlob(function(blob){
          res(blob || file);
        }, "image/jpeg", 0.78);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); res(file); };
      img.src = url;
    });
  }

  function addPhotos(files){
    var list = Array.prototype.slice.call(files).filter(function(f){
      return f && f.type && f.type.indexOf("image") === 0;
    });
    if(!list.length) return;
    var m = meal || mealByHour();
    toast("处理中…");
    var jobs = list.map(function(f, i){
      return shrink(f).then(function(blob){
        var ts = Date.now() + i;
        return dbPut({
          id: String(ts) + Math.random().toString(16).slice(2,6),
          date: todayStr(0),
          meal: m,
          ts: ts,
          type: "image/jpeg",
          size: blob.size,
          blob: blob
        });
      });
    });
    Promise.all(jobs).then(function(){
      return refreshPhotos();
    }).then(function(){
      toast("已存 " + list.length + " 张 · " + m);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }).catch(function(){
      toast("存照片失败，可能是空间不够");
    });
  }

  function refreshPhotos(){
    return dbAll().then(function(all){
      photos = all.sort(function(a,b){ return b.ts - a.ts; });
      renderFood();
    });
  }

  function urlFor(p){
    if(!urls[p.id]) urls[p.id] = URL.createObjectURL(p.blob);
    return urls[p.id];
  }

  function renderFood(){
    var wrap = $("foodList");
    wrap.innerHTML = "";

    if(!photos.length){
      var e = document.createElement("div");
      e.className = "empty";
      e.textContent = "还没有照片，吃之前拍一张就行";
      wrap.appendChild(e);
    }else{
      var byDate = {};
      var order = [];
      photos.forEach(function(p){
        if(!byDate[p.date]){ byDate[p.date] = []; order.push(p.date); }
        byDate[p.date].push(p);
      });

      order.forEach(function(date){
        var g = document.createElement("div");
        g.className = "daygroup";

        var head = document.createElement("div");
        head.className = "dayhead";
        var d = document.createElement("span");
        d.className = "d";
        var rel = relLabel(date);
        d.textContent = fmtDate(date) + (rel ? "  " + rel : "") + "  ·  " + byDate[date].length + " 张";
        head.appendChild(d);

        var sh = document.createElement("button");
        sh.className = "ghost"; sh.type = "button"; sh.textContent = "分享这天";
        sh.addEventListener("click", function(){ sharePhotos(byDate[date], fmtDate(date)); });
        head.appendChild(sh);

        var grid = document.createElement("div");
        grid.className = "grid";
        byDate[date].forEach(function(p){
          var cell = document.createElement("div");
          cell.className = "shot";
          var im = document.createElement("img");
          im.loading = "lazy";
          im.src = urlFor(p);
          im.alt = p.meal;
          var tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = p.meal + " " + fmtTime(p.ts);
          cell.appendChild(im);
          cell.appendChild(tag);
          cell.addEventListener("click", function(){ openViewer(p); });
          grid.appendChild(cell);
        });

        g.appendChild(head);
        g.appendChild(grid);
        wrap.appendChild(g);
      });
    }

    $("foodTitle").textContent = "最近吃的" + (photos.length ? "（" + photos.length + " 张）" : "");
    var bytes = photos.reduce(function(s,p){ return s + (p.size || 0); }, 0);
    var sizeTxt = bytes >= 1048576
      ? (bytes/1048576).toFixed(1) + " MB"
      : Math.max(1, Math.round(bytes/1024)) + " KB";
    $("usage").textContent = photos.length
      ? "共 " + photos.length + " 张，约 " + sizeTxt
      : "";
    renderStat();
  }

  function fileName(p){
    return p.date + "_" + p.meal + "_" + fmtTime(p.ts).replace(":", "") + ".jpg";
  }

  function sharePhotos(items, title){
    if(!items || !items.length) return toast("这天还没有照片");
    var files = items.map(function(p){
      return new File([p.blob], fileName(p), { type: "image/jpeg" });
    });
    if(navigator.canShare && navigator.canShare({ files: files }) && navigator.share){
      navigator.share({ files: files, title: title || "吃的记录" }).catch(function(){});
    }else{
      files.forEach(function(f, i){
        setTimeout(function(){
          var a = document.createElement("a");
          a.href = URL.createObjectURL(f);
          a.download = f.name;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
        }, i * 400);
      });
      toast("已下载 " + files.length + " 张");
    }
  }

  function openViewer(p){
    viewing = p;
    $("vImg").src = urlFor(p);
    var rel = relLabel(p.date);
    $("vMeta").textContent = fmtDate(p.date) + (rel ? "  " + rel : "") + "  ·  " + p.meal + "  ·  " + fmtTime(p.ts);
    $("viewer").showModal();
  }

  /* ---------- 初始化 ---------- */

  function switchTab(name){
    tab = name;
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(b){
      b.classList.toggle("on", b.dataset.tab === name);
    });
    $("pane-move").classList.toggle("hidden", name !== "move");
    $("pane-food").classList.toggle("hidden", name !== "food");
    $("title").textContent = name === "food" ? "吃了什么" : "运动记录";
    if(name === "food" && !meal){
      meal = mealByHour();
      paint($("meals"), meal);
    }
    renderStat();
    window.scrollTo({ top: 0 });
  }

  function init(){
    load();
    loadGoal();
    chips($("acts"), ACTS, pickAct);
    chips($("parts"), PARTS, pickPart, "small");
    chips($("mins"), MINS, pickMins, "small");
    chips($("meals"), MEALS, function(v){
      meal = v; paint($("meals"), meal);
    });

    sel.date = todayStr(0);
    $("date").value = sel.date;
    paintDays();
    meal = mealByHour();
    paint($("meals"), meal);

    $("date").addEventListener("change", function(){
      sel.date = this.value;
      paintDays();
      refreshSave();
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-day]"), function(b){
      b.addEventListener("click", function(){ pickDay(Number(b.dataset.day)); refreshSave(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(b){
      b.addEventListener("click", function(){ switchTab(b.dataset.tab); });
    });
    $("minsCustom").addEventListener("input", function(){
      if(this.value){ sel.mins = 0; paint($("mins"), ""); }
      refreshSave();
    });
    $("save").addEventListener("click", addRecord);
    $("copy").addEventListener("click", copyOut);
    $("goalMinus").addEventListener("click", function(){ changeGoal(-1); });
    $("goalPlus").addEventListener("click", function(){ changeGoal(1); });

    $("camera").addEventListener("change", function(){
      if(this.files && this.files.length) addPhotos(this.files);
      this.value = "";
    });
    $("picker").addEventListener("change", function(){
      if(this.files && this.files.length) addPhotos(this.files);
      this.value = "";
    });
    $("vShare").addEventListener("click", function(){
      if(viewing) sharePhotos([viewing], "吃的记录");
    });
    $("vDelete").addEventListener("click", function(){
      if(!viewing) return;
      var id = viewing.id;
      if(urls[id]){ URL.revokeObjectURL(urls[id]); delete urls[id]; }
      viewing = null;
      $("viewer").close();
      dbDel(id).then(refreshPhotos).then(function(){ toast("已删除"); });
    });
    $("vClose").addEventListener("click", function(){ $("viewer").close(); });

    $("backup").addEventListener("click", function(){
      $("dlgText").value = JSON.stringify(records);
      $("dlg").showModal();
    });
    $("dlgClose").addEventListener("click", function(){ $("dlg").close(); });
    $("dlgRestore").addEventListener("click", function(){
      try{
        var data = JSON.parse($("dlgText").value);
        if(!Array.isArray(data)) throw new Error("bad");
        records = data;
        persist(); render();
        $("dlg").close();
        toast("已恢复 " + data.length + " 条");
      }catch(e){ toast("格式不对，检查一下"); }
    });

    render();
    refreshSave();
    refreshPhotos().catch(function(){ toast("这个浏览器不支持存照片"); });
  }

  document.addEventListener("DOMContentLoaded", init);

  // 离线可用：只在 http(s) 下注册，本地文件打开时跳过
  if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
